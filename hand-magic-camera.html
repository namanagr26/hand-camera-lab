<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Magic Camera</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #05060a; color: #e8ecff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  video, canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  video { filter: brightness(0.55) saturate(0.8); }
  #fx { mix-blend-mode: screen; }
  #ui { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; z-index: 5; padding: 8px; background: rgba(10,12,22,.55); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.08); border-radius: 18px; }
  #ui button { border: 0; padding: 10px 16px; border-radius: 12px; background: rgba(255,255,255,.06); color: #cfd6ff; font-size: 14px; font-weight: 600; cursor: pointer; transition: .15s; }
  #ui button:hover { background: rgba(255,255,255,.14); }
  #ui button.on { background: linear-gradient(135deg,#7b5cff,#ff4fd8); color: #fff; box-shadow: 0 0 18px rgba(200,90,255,.5); }
  #hint { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 5; font-size: 14px; padding: 8px 14px; border-radius: 999px; background: rgba(10,12,22,.55); backdrop-filter: blur(10px); color: #cfd6ff; white-space: nowrap; }
  #start { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding: 24px; background: radial-gradient(circle at 50% 40%, #1d1440, #05060a 70%); }
  #start h1 { font-size: clamp(32px, 6vw, 60px); background: linear-gradient(135deg,#8ad4ff,#b06bff,#ff5fd2); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #start p { color: #9aa3c7; max-width: 440px; line-height: 1.5; }
  #go { border: 0; padding: 14px 32px; font-size: 18px; font-weight: 700; border-radius: 14px; cursor: pointer; color: #fff; background: linear-gradient(135deg,#7b5cff,#ff4fd8); box-shadow: 0 0 30px rgba(200,90,255,.5); }
  #go:disabled { opacity: .6; cursor: wait; }
  #err { color: #ff8a9a; max-width: 460px; }
</style>
</head>
<body>
<div id="start">
  <h1>✋ Hand Magic</h1>
  <p>Wave your hand at the camera and watch the effects follow your fingers. Works best in Chrome or Edge, with good lighting.</p>
  <button id="go">Start camera</button>
  <p id="err"></p>
</div>

<div id="stage">
  <video id="cam" playsinline muted></video>
  <canvas id="fx"></canvas>
</div>
<div id="hint">Loading…</div>
<div id="ui">
  <button data-mode="sparks" class="on">✨ Sparks</button>
  <button data-mode="draw">🖌️ Air Draw</button>
  <button data-mode="orb">🔮 Energy Orb</button>
  <button data-mode="lightning">⚡ Lightning</button>
  <button data-mode="neon">🦴 Neon Hand</button>
  <button id="clear">🧹 Clear</button>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById('cam');
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');

const HINTS = {
  sparks: 'Move your fingers — sparks fly from your fingertips',
  draw: 'Pinch thumb + index to draw · open hand to stop · ✊ fist to erase',
  orb: 'Pinch slowly open: an orb grows between thumb and index · use 2 hands!',
  lightning: 'Show both hands — lightning connects your fingertips',
  neon: 'Your hand becomes a glowing neon skeleton',
};
let mode = 'sparks';
document.querySelectorAll('#ui button[data-mode]').forEach(b => b.onclick = () => {
  document.querySelectorAll('#ui button[data-mode]').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); mode = b.dataset.mode; hint.textContent = HINTS[mode];
});
document.getElementById('clear').onclick = () => { strokes.length = 0; particles.length = 0; };

// Hand skeleton connections
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const TIPS = [4, 8, 12, 16, 20];

let W = 0, H = 0, dpr = 1;
// map video-normalised coords to canvas pixels, accounting for object-fit: cover
let sx = 1, sy = 1, ox = 0, oy = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const s = Math.max(W / vw, H / vh);
  sx = vw * s; sy = vh * s; ox = (W - sx) / 2; oy = (H - sy) / 2;
}
addEventListener('resize', resize);
const P = lm => ({ x: ox + lm.x * sx, y: oy + lm.y * sy });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// ---------- Particles ----------
const particles = [];
function emit(x, y, hue, n = 3, speed = 2.5) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * speed;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.5, life: 1, size: 2 + Math.random() * 4, hue: hue + Math.random() * 40 - 20 });
  }
  if (particles.length > 2500) particles.splice(0, particles.length - 2500);
}
function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.98; p.life -= 0.018;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.fillStyle = `hsla(${p.hue},100%,65%,${p.life})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
  }
}

// ---------- Air drawing ----------
const strokes = []; // {pts:[], hue}
const penDown = new Map(); // hand index -> current stroke
function isFist(lm) {
  const wrist = P(lm[0]), palm = dist(wrist, P(lm[9]));
  return [8, 12, 16, 20].every(t => dist(P(lm[t]), wrist) < palm * 1.1);
}
function drawStrokes() {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const s of strokes) {
    if (s.pts.length < 2) continue;
    for (const [w, a] of [[14, .25], [5, 1]]) {
      ctx.strokeStyle = `hsla(${s.hue},100%,${w > 10 ? 60 : 80}%,${a})`;
      ctx.lineWidth = w; ctx.shadowColor = `hsl(${s.hue},100%,60%)`; ctx.shadowBlur = w > 10 ? 25 : 8;
      ctx.beginPath(); ctx.moveTo(s.pts[0].x, s.pts[0].y);
      for (let i = 1; i < s.pts.length - 1; i++) {
        const m = { x: (s.pts[i].x + s.pts[i + 1].x) / 2, y: (s.pts[i].y + s.pts[i + 1].y) / 2 };
        ctx.quadraticCurveTo(s.pts[i].x, s.pts[i].y, m.x, m.y);
      }
      ctx.stroke();
    }
  }
  ctx.shadowBlur = 0;
}

// ---------- Orb ----------
function orb(x, y, r, hue, t) {
  r = Math.max(8, r);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 1.8);
  g.addColorStop(0, `hsla(${hue},100%,95%,1)`);
  g.addColorStop(0.25, `hsla(${hue},100%,65%,.9)`);
  g.addColorStop(0.6, `hsla(${hue + 40},100%,50%,.35)`);
  g.addColorStop(1, `hsla(${hue + 60},100%,40%,0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 1.8, 0, Math.PI * 2); ctx.fill();
  // swirling rings
  ctx.strokeStyle = `hsla(${hue + 20},100%,75%,.6)`; ctx.lineWidth = 2;
  for (let k = 0; k < 3; k++) {
    ctx.beginPath();
    ctx.ellipse(x, y, r * (1 + k * .25), r * (.35 + k * .1), t * (1 + k * .5) + k, 0, Math.PI * 2);
    ctx.stroke();
  }
  if (Math.random() < .6) emit(x + (Math.random() - .5) * r, y + (Math.random() - .5) * r, hue, 1, 1.5);
}

// ---------- Lightning ----------
function bolt(a, b, hue, depth = 0) {
  const pts = [a]; const n = 10;
  const len = dist(a, b), nx = -(b.y - a.y) / (len || 1), ny = (b.x - a.x) / (len || 1);
  for (let i = 1; i < n; i++) {
    const t = i / n, off = (Math.random() - .5) * len * .18;
    pts.push({ x: a.x + (b.x - a.x) * t + nx * off, y: a.y + (b.y - a.y) * t + ny * off });
  }
  pts.push(b);
  for (const [w, l, blur] of [[6, 60, 25], [2, 95, 0]]) {
    ctx.strokeStyle = `hsla(${hue},100%,${l}%,${depth ? .5 : 1})`; ctx.lineWidth = depth ? w / 2 : w;
    ctx.shadowColor = `hsl(${hue},100%,60%)`; ctx.shadowBlur = blur;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); pts.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
  }
  ctx.shadowBlur = 0;
  if (!depth && Math.random() < .5) { // branch
    const s = pts[2 + (Math.random() * 6 | 0)];
    bolt(s, { x: s.x + (Math.random() - .5) * len * .4, y: s.y + (Math.random() - .5) * len * .4 }, hue, 1);
  }
}

// ---------- Neon skeleton ----------
function neon(lm, hue) {
  const pts = lm.map(P);
  ctx.lineCap = 'round';
  for (const [w, l, blur] of [[10, 55, 30], [3, 90, 0]]) {
    ctx.strokeStyle = `hsl(${hue},100%,${l}%)`; ctx.lineWidth = w; ctx.shadowColor = `hsl(${hue},100%,60%)`; ctx.shadowBlur = blur;
    ctx.beginPath();
    for (const [i, j] of BONES) { ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); }
    ctx.stroke();
  }
  ctx.shadowBlur = 15;
  for (const p of pts) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill(); }
  ctx.shadowBlur = 0;
}

// ---------- Main loop ----------
let landmarker, lastVideoTime = -1, prevTips = [];
function frame(now) {
  requestAnimationFrame(frame);
  let hands = [];
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, now);
    hands = res.landmarks || [];
    frame.last = hands;
  } else hands = frame.last || [];

  const t = now / 1000;
  const baseHue = (t * 40) % 360;
  ctx.clearRect(0, 0, W, H);

  if (mode === 'draw') {
    hands.forEach((lm, h) => {
      const tip = P(lm[8]), thumb = P(lm[4]), palm = dist(P(lm[0]), P(lm[9]));
      if (isFist(lm)) { // erase near hand
        const c = P(lm[9]);
        strokes.forEach(s => s.pts = s.pts.filter(p => dist(p, c) > palm * 1.3));
        for (let i = strokes.length - 1; i >= 0; i--) if (strokes[i].pts.length < 2 && strokes[i] !== penDown.get(h)) strokes.splice(i, 1);
        ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(c.x, c.y, palm * 1.3, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
        penDown.delete(h); return;
      }
      const pinched = dist(tip, thumb) < palm * 0.35;
      const pen = { x: (tip.x + thumb.x) / 2, y: (tip.y + thumb.y) / 2 };
      if (pinched) {
        let s = penDown.get(h);
        if (!s) { s = { pts: [], hue: baseHue }; strokes.push(s); penDown.set(h, s); }
        const last = s.pts[s.pts.length - 1];
        if (!last || dist(last, pen) > 3) s.pts.push(pen);
        emit(pen.x, pen.y, s.hue, 1, 1);
      } else penDown.delete(h);
      // cursor
      ctx.fillStyle = pinched ? `hsl(${baseHue},100%,70%)` : 'rgba(255,255,255,.5)';
      ctx.beginPath(); ctx.arc(pen.x, pen.y, pinched ? 8 : 5, 0, Math.PI * 2); ctx.fill();
    });
    if (!hands.length) penDown.clear();
    drawStrokes();
  }

  if (mode === 'sparks') {
    const tips = [];
    hands.forEach((lm, h) => TIPS.forEach((ti, k) => {
      const p = P(lm[ti]); tips.push(p);
      const prev = prevTips[tips.length - 1];
      const speed = prev ? Math.min(dist(p, prev), 60) : 0;
      emit(p.x, p.y, baseHue + k * 30 + h * 120, 1 + (speed / 6 | 0), 1.5 + speed / 10);
    }));
    prevTips = tips;
  }

  if (mode === 'orb') {
    if (hands.length >= 2) {
      const a = P(hands[0][9]), b = P(hands[1][9]);
      const c = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      orb(c.x, c.y, dist(a, b) * 0.28, baseHue, t);
      bolt(P(hands[0][8]), c, baseHue + 40); bolt(P(hands[1][8]), c, baseHue + 40);
    } else hands.forEach(lm => {
      const a = P(lm[4]), b = P(lm[8]);
      orb((a.x + b.x) / 2, (a.y + b.y) / 2, dist(a, b) * 0.45, baseHue, t);
    });
  }

  if (mode === 'lightning') {
    if (hands.length >= 2) {
      TIPS.forEach((ti, k) => bolt(P(hands[0][ti]), P(hands[1][ti]), 190 + k * 15));
    } else hands.forEach(lm => {
      for (let k = 0; k < 4; k++) bolt(P(lm[TIPS[k]]), P(lm[TIPS[k + 1]]), 200 + k * 10);
    });
    hands.forEach(lm => TIPS.forEach(ti => { const p = P(lm[ti]); emit(p.x, p.y, 200, 1, 2); }));
  }

  if (mode === 'neon') hands.forEach((lm, h) => neon(lm, (baseHue + h * 150) % 360));

  drawParticles();
  if (!hands.length) hint.textContent = '👋 Show your hand to the camera';
  else hint.textContent = HINTS[mode];
}

document.getElementById('go').onclick = async () => {
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Loading hand tracker…'; err.textContent = '';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }, audio: false });
    video.srcObject = stream; await video.play();
    const fileset = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts = (delegate) => ({
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate },
      runningMode: 'VIDEO', numHands: 2,
    });
    try { landmarker = await HandLandmarker.createFromOptions(fileset, opts('GPU')); }
    catch { landmarker = await HandLandmarker.createFromOptions(fileset, opts('CPU')); }
    resize();
    document.getElementById('start').remove();
    hint.textContent = HINTS[mode];
    requestAnimationFrame(frame);
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.textContent = 'Try again';
    err.textContent = e.name === 'NotAllowedError' ? 'Camera permission was blocked. Allow camera access in your browser and try again.' : 'Something went wrong: ' + (e.message || e);
  }
};
</script>
</body>
</html>
